<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A clean, modern reminder & scheduling app. Single file, no backend.">
<title>Switchr — Study & Personal Reminders</title>

<!--
  ============================================================================
  PWA wiring
  ============================================================================
  - manifest.json : app identity, icons, standalone display
  - sw.js         : service worker — precaches the app shell for offline use
  - theme-color   : tints the browser UI; kept in sync with the light/dark
                    theme by setTheme() in the script below
  ============================================================================
-->
<meta name="theme-color" content="#f4f6fc">
<link rel="manifest" href="manifest.json">
<!-- iOS home-screen support (Safari reads these instead of the manifest) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Switchr">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Browser tab favicon reuses the PWA icons -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<!--
  ============================================================================
  Switchr — a self-contained reminder & scheduling web app
  ============================================================================
  - Single HTML file: inline CSS + vanilla JS. No frameworks, no backend.
  - Data persists to localStorage ("remindly.reminders.v1").
  - Modes: "Study" and "Personal" — a pill toggle filters the list, tints the
    UI (CSS custom property --accent), and pre-fills new reminders.
  - Reminders: title, notes, date, time, category, priority, repeat.
  - Notifications: real browser Notification on trigger, with toast fallback.
  - Brand: Switchr — the header mark is an inline SVG that flips like a
    real switch when you toggle modes; wordmark dot tints with the mode.
  - Extras: stats line, search, interactive month calendar with Indian
    festivals & holidays (festivals.json, offline), light/dark theme.
  ============================================================================
-->

<!-- Load Inter from Google Fonts (graceful fallback to system sans if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Apply the saved (or OS-preferred) theme BEFORE first paint, so dark-mode
     users don't get a white flash. The main script's setTheme() takes over
     after load; both read the same prefs key so they always agree. -->
<script>
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('remindly.prefs.v1') || '{}');
    var theme = prefs.theme ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  } catch (e) { /* default light theme applies */ }
})();
</script>

<style>
/* ===========================================================================
   1. DESIGN TOKENS
   Two themes (light/dark) via [data-theme], plus a per-mode accent that is
   swapped on <body data-mode="study|personal">. Everything else reads from
   these variables, so switching tone/theme is one attribute change.
   ========================================================================= */
:root {
  /* Typography */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;

  /* Radii — iOS continuous-corner feel */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(17,24,39,.05), 0 4px 14px rgba(17,24,39,.06);
  --shadow-md: 0 10px 34px rgba(17,24,39,.14);
  --shadow-lg: 0 24px 70px rgba(17,24,39,.28);

  /* Layout */
  --max-w: 1060px;

  /* Motion — springy, like iOS view transitions */
  --t-fast: .16s ease;
  --t-med:  .32s cubic-bezier(.32,.72,.28,1);

  /* "Liquid glass" tokens — frosted translucent surfaces. Cards, the header
     and toasts all read these, so the material is defined in one place.
     --glass-sheen is a subtle top-to-bottom highlight that gives panes their
     specular "glass edge"; themes override it (none needed if empty). */
  --glass-bg:  rgba(255,255,255,.66);
  --glass-brd: rgba(255,255,255,.70);
  --glass-blur: saturate(180%) blur(22px);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%);
}

/* ---------- Light theme (default) ---------- */
:root, [data-theme="light"] {
  --bg:          #eef1f8;   /* base color behind the wash */
  /* Airy sky wash with subtle blue/orange glow blobs (painted by body::before) */
  --bg-wash:
    radial-gradient(1100px 520px at 85% -10%, rgba(255,149,0,.16), transparent 60%),
    radial-gradient(900px 520px at -12% 12%,  rgba(0,122,255,.13), transparent 55%),
    linear-gradient(180deg, #f4f6fc 0%, #edf1f9 55%, #eef2f8 100%);
  --surface:     #ffffff;   /* solid surface: modal, toasts, toggle thumb */
  --surface-2:   rgba(120,122,132,.10);  /* wells (search, inputs, hover) */
  --text:        #1c1c1e;   /* iOS label */
  --text-soft:   #7c7f87;   /* iOS secondaryLabel */
  --border:      rgba(60,60,67,.10);   /* iOS separator */
  --success:     #34c759;   /* iOS green */
  --danger:      #ff3b30;   /* iOS red */
  --danger-soft: rgba(255,59,48,.10);
  --overlay:     rgba(20,24,34,.40);
  /* Indian-festival dot color — FIXED purple, never shifts with theme/mode.
     (It must never equal --accent: in Personal mode the accent is orange,
     and a saffron festival dot was indistinguishable from it.) */
  --festival:    #a855f7;
  --festival-strong: #9333ea;

  /* Mode accents — Study = iOS system blue (overridden below for Personal) */
  --accent:        #007aff;
  --accent-strong: #0069d9;
  --accent-soft:   rgba(0,122,255,.12);
  --accent-softer: rgba(0,122,255,.07);
}

/* ---------- Dark theme ---------- */
[data-theme="dark"] {
  --bg:          #0a0b10;
  --bg-wash:
    /* Glows are STRONGER in dark: frosted panes need color behind them to
       read as glass — over a near-black page they'd look like flat gray. */
    radial-gradient(1100px 520px at 85% -10%, rgba(255,159,10,.17), transparent 60%),
    radial-gradient(900px 560px at -12% 10%,  rgba(10,132,255,.24), transparent 58%),
    radial-gradient(1200px 720px at 50% 115%, rgba(94,92,230,.16), transparent 62%),
    linear-gradient(180deg, #14161f 0%, #0b0d13 50%, #0a0b10 100%);
  --surface:     #2a2d3a;
  --surface-2:   rgba(120,122,132,.18);
  --text:        #f5f5f7;
  --text-soft:   #a1a1aa;
  --border:      rgba(255,255,255,.13);
  /* Festival purple pops brighter against the dark wash */
  --festival:    #c084fc;
  --festival-strong: #d8b4fe;
  --success:     #30d158;
  --danger:      #ff453a;
  --danger-soft: rgba(255,69,58,.14);
  --overlay:     rgba(0,0,0,.55);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.35);
  --shadow-md: 0 10px 34px rgba(0,0,0,.5);
  --shadow-lg: 0 24px 70px rgba(0,0,0,.65);

  /* Glass recolors for dark: lifted pane (not pitch black), brighter
     hairline, gentler saturation, thin light sheen along the top edge. */
  --glass-bg:  rgba(30,32,42,.58);
  --glass-brd: rgba(255,255,255,.14);
  --glass-blur: saturate(150%) blur(24px);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 38%);
}

/* Dark-mode Personal accent: iOS dark-mode orange */
[data-theme="dark"] [data-mode="personal"] {
  --accent:        #ff9f0a;
  --accent-strong: #ffb340;
  --accent-soft:   rgba(255,159,10,.20);
  --accent-softer: rgba(255,159,10,.10);
}

/* ---------- Personal mode accent (iOS orange) ---------- */
[data-mode="personal"] {
  --accent:        #ff9500;
  --accent-strong: #e68600;
  --accent-soft:   rgba(255,149,0,.14);
  --accent-softer: rgba(255,149,0,.08);
}

/* ===========================================================================
   2. BASE / RESET
   ========================================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  transition: background var(--t-med), color var(--t-med);
  -webkit-font-smoothing: antialiased;
}

/* The gradient glow wash lives on a FIXED layer behind everything, so the
   frosted-glass panels have something colorful to blur (fixed = it doesn't
   scroll, which sells the "glass over content" illusion). */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background: var(--bg-wash);
}

/* Visible focus ring for keyboard users (a11y) */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Icon-only buttons (edit/delete, theme) */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border: none; border-radius: var(--r-sm);
  background: transparent; color: var(--text-soft); cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ===========================================================================
   3. HEADER
   ========================================================================= */
/* Header sheen is weaker than cards' — iOS bars stay understated */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--glass-sheen), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--glass-brd);
  box-shadow: 0 1px 24px rgba(17,24,39,.06);
}
[data-theme="dark"] .app-header { box-shadow: none; }

/* Dark theme: lift every translucent white "well" (hover states, inputs,
   the toggle track, completed-count chip) so they don't turn muddy. */
[data-theme="dark"] .icon-btn:hover,
[data-theme="dark"] .search-wrap input,
[data-theme="dark"] .mode-toggle {
  background: rgba(255,255,255,.08);
}
[data-theme="dark"] .field input,
[data-theme="dark"] .field select,
[data-theme="dark"] .field textarea { background: rgba(255,255,255,.07); }
[data-theme="dark"] .completed-head .count { background: rgba(255,255,255,.10); }
.header-inner {
  max-width: var(--max-w); margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
/* Brand mark — the switch logo. Colors are fixed brand colors; the whole
   mark flips horizontally in Personal mode (transitioned, like a real
   switch being toggled). */
.brand-badge { width: 42px; flex: none; line-height: 0; }
.brand-badge svg { width: 100%; height: auto; display: block; transition: transform var(--t-med); }
.brand-badge .logo-blue   { fill: #1f8fff; }
.brand-badge .logo-orange { fill: #ffa013; }
body[data-mode="personal"] .brand-badge svg { transform: scaleX(-1); }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
/* The dot of the "i" is drawn in CSS (over a dotless ı) so it can tint
   with the active mode — blue in Study, orange in Personal, exactly like
   the two logo lockups. */
.brand h1 .tittle { position: relative; }
.brand h1 .tittle::after {
  content: ""; position: absolute; left: 50%; top: .24em; transform: translateX(-50%);
  width: .17em; height: .17em; border-radius: 50%;
  background: var(--accent); transition: background var(--t-med);
}
/* Wordmark + greeting stack under the logo mark */
.brand-txt { min-width: 0; }
.brand small {
  display: block; font-size: 11px; letter-spacing: .02em;
  color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand small .greet { font-weight: 600; color: var(--text); }
.brand small .d { font-weight: 500; }

/* Theme toggle — round glass chip like an iOS toolbar button.
   No ring on click/tap (Safari & devtools emulation can keep :focus-visible
   stuck after a click, which read as a stray blue outline in dark mode).
   Keyboard users still get a subtle neutral ring via :focus-visible. */
.theme-btn {
  font-size: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--glass-brd);
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.theme-btn:focus:not(:focus-visible) { outline: none; box-shadow: none; }
.theme-btn:focus-visible { outline: 1px solid var(--glass-brd); outline-offset: 2px; }

/* ===========================================================================
   4. MODE TOGGLE (pill segmented control)
   ========================================================================= */
.mode-toggle {
  position: relative;   /* IMPORTANT: anchors the absolutely-positioned thumb —
                           without this the thumb sizes/slides to the header! */
  display: inline-flex; padding: 3px;
  background: var(--surface-2); border-radius: var(--r-pill);
  border: 1px solid var(--glass-brd);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.mode-btn {
  position: relative; z-index: 1;           /* keep labels above the thumb */
  flex: 1 1 0;                              /* equal widths → 50% thumb lines up */
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer;
  padding: 7px 18px; border-radius: var(--r-pill);
  font: 600 14px var(--font); color: var(--text-soft); white-space: nowrap;
  transition: color var(--t-fast);
}
/* The sliding white "pill" that sits behind the active label */
/* Insets (3px) must match the toggle's padding; width math: half the padding
   box minus half the border = calc(50% - 4px). Keep in sync with padding! */
.mode-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px;
  width: calc(50% - 4px);
  background: var(--surface); border-radius: var(--r-pill);
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-med), width var(--t-med);
}
.mode-toggle[data-active="personal"] .mode-thumb { transform: translateX(100%); }
.mode-btn.active { color: var(--accent-strong); }
.mode-btn .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 6px; vertical-align: 1px;
  transition: background var(--t-med);
}
/* Each tab keeps its OWN dot color — the active tab's accent changes with
   mode, but the inactive tab's dot must stay put (Study = always blue,
   Personal = always orange) or the labels become ambiguous. */
.mode-btn[data-mode="study"] .dot    { background: #007aff; }
.mode-btn[data-mode="personal"] .dot { background: #ff9500; }

/* ===========================================================================
   5. STATS LINE + TOOLBAR (search / add button)
   ========================================================================= */
.stats-line { font-size: 12.5px; color: var(--text-soft); flex-basis: 100%; }
.stats-line b { color: var(--text); font-weight: 600; }
.stats-line .overdue { color: var(--danger); font-weight: 600; }

/* ===========================================================================
   6. LAYOUT — two columns on desktop, stacked on mobile
   ========================================================================= */
.main {
  max-width: var(--max-w); margin: 0 auto; padding: 20px;
  display: grid; grid-template-columns: 1fr 336px; gap: 20px;
  align-items: start;
}
@media (max-width: 880px) {
  .main { grid-template-columns: 1fr; }
  /* One panel at a time — switched by the List/Calendar pill tabs above */
  .view-switch { display: flex; justify-content: center; padding: 0 20px 14px; }
  body[data-view="calendar"] .list-panel { display: none; }
  body[data-view="calendar"] .view-switch .view-tab:not(.on) { /* stays tappable */ }
  body:not([data-view="calendar"]) .calendar-panel { display: none; }
}

/* Generic card — the "liquid glass" pane: translucent, blurred, hairline,
   with the sheen gradient layered on top for the specular glass edge. */
.card {
  background: var(--glass-sheen), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-brd);
  border-radius: 24px;
  box-shadow: var(--shadow-sm);
}

/* ===========================================================================
   7. LIST PANEL
   ========================================================================= */
.list-panel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 22px 20px 12px;
}
/* iOS-style large title */
.list-panel-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.035em; margin-right: auto; }

/* Search input */
.search-wrap { position: relative; flex: 1 1 150px; max-width: 230px; }
.search-wrap .icon-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; pointer-events: none; font-size: 13px; }
.search-wrap input {
  width: 100%; padding: 8px 34px 8px 12px;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text); font: 500 13px var(--font);
  transition: border-color var(--t-fast), background var(--t-fast);
}
.search-wrap input:focus { border-color: var(--accent); outline: none; }
.search-wrap input::placeholder { color: var(--text-soft); }

/* Primary "Add Reminder" button */
.add-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 20px; border: none; border-radius: var(--r-pill);
  background: var(--accent); color: #fff; cursor: pointer;
  font: 600 14px var(--font); box-shadow: 0 2px 12px var(--accent-soft);
  transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-med);
}
/* Dark orange buttons are light — keep label dark for contrast, iOS-style */
[data-theme="dark"] [data-mode="personal"] .add-btn {
  color: #3f2800; text-shadow: none;
}
.add-btn:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 6px 16px var(--accent-soft); }
.add-btn:active { transform: translateY(0); }

/* Reminder list */
.reminder-list { list-style: none; padding: 6px 10px 12px; }

/* One reminder row */
.reminder-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 13px 12px; border-radius: var(--r-md); position: relative;
  transition: background var(--t-fast), opacity var(--t-med), transform var(--t-med);
  animation: item-in .28s cubic-bezier(.4,0,.2,1) both;
}
@keyframes item-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.reminder-item + .reminder-item { border-top: 1px solid var(--border); }

/* Overdue flag: red left border + tinted title */
.reminder-item.overdue { background: var(--danger-soft); border-radius: var(--r-md); }
.reminder-item.overdue::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
  width: 4px; border-radius: 4px; background: var(--danger);
}

/* Hover-revealed row actions */
.rem-actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity var(--t-fast); }
.reminder-item:hover .rem-actions, .reminder-item:focus-within .rem-actions { opacity: 1; }
@media (hover: none) { .rem-actions { opacity: 1; } } /* always visible on touch devices */

/* Checkbox — iOS Reminders' hollow circle that fills with the list color */
.rem-check {
  appearance: none; width: 23px; height: 23px; flex: none; margin-top: 1px;
  border: 2px solid var(--border); border-radius: 50%; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.rem-check:hover { border-color: var(--accent); transform: scale(1.06); }
.rem-check:checked { background: var(--accent); border-color: var(--accent); }
.rem-check:checked::after { content: "✓"; font-weight: 800; animation: pop .2s ease; }
@keyframes pop { 50% { transform: scale(1.4); } }

/* Row text */
.rem-body { min-width: 0; flex: 1; }
.rem-title { font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
.reminder-item.done .rem-title { text-decoration: line-through; color: var(--text-soft); }
.rem-notes { font-size: 12.5px; color: var(--text-soft); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rem-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; font-size: 12px; color: var(--text-soft); align-items: center; }

/* Category / priority / repeat tags */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; }
.tag-cat { background: var(--accent-soft); color: var(--accent-strong); }
.tag-pri { border: 1px solid var(--border); color: var(--text-soft); }
.tag-pri.high   { color: var(--danger);  border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.tag-pri.medium { color: #d97706; border-color: color-mix(in srgb, #d97706 35%, transparent); }
[data-theme="dark"] .tag-pri.medium { color: #ffb340; border-color: rgba(255,179,64,.4); }
.countdown { font-weight: 600; color: var(--accent-strong); transition: color var(--t-med); }
.reminder-item.overdue .countdown { color: var(--danger); }

/* Repeat chip */
.tag-repeat { border: 1px dashed var(--border); color: var(--text-soft); }

/* Completed section */
.completed-sec { border-top: 1px solid var(--border); padding: 10px 18px 16px; }
.completed-head {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: none; border: none; cursor: pointer; padding: 6px 0;
  font: 600 13px var(--font); color: var(--text-soft);
}
.completed-head .chev { transition: transform var(--t-med); }
.completed-head.open .chev { transform: rotate(90deg); }
.completed-list { overflow: hidden; transition: max-height var(--t-med); }
.completed-head .count { background: var(--surface-2); border-radius: var(--r-pill); padding: 0 8px; font-size: 11px; }

/* Empty state */
.empty-state { text-align: center; padding: 46px 20px; color: var(--text-soft); }
.empty-state .ico { font-size: 38px; display: block; margin-bottom: 10px; }
.empty-state h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
.empty-state p { font-size: 13px; max-width: 300px; margin: 0 auto 16px; }
.empty-state .add-btn { padding: 8px 16px; font-size: 13px; }

/* "This week at a glance" — 7-day strip shown under the empty-state copy
   so an empty category still shows nearby life (festivals/reminders). */
.glance { margin: 26px auto 0; max-width: 340px; }
.glance .g-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-soft); margin-bottom: 10px;
}
.glance .g-row { display: flex; justify-content: center; gap: 6px; }
.g-day {
  flex: 1 1 0; max-width: 46px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px 7px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface-2);
  font: inherit; color: inherit; cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.g-day:hover { background: var(--accent-softer); border-color: var(--accent-soft); transform: translateY(-1px); }
div.g-day { cursor: default; }  /* only button days (with content) act clickable */

/* ===========================================================================

   ========================================================================= */
.cal-panel { padding: 18px; position: relative; }   /* relative → popover anchor */
.cal-head { display: flex; align-items: center; margin-bottom: 12px; }

/* List / Calendar mini pill tabs (mobile only — desktop shows both panels) */
.view-switch { display: none; }
.view-tabs {

}
.view-tab {

}

/* Month navigation row: ‹ month-year › + 'today' button */
.cal-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-nav h4 {

}

.icon-btn.sm { width: 28px; height: 28px; font-size: 13px; border-radius: 50%; }
.cal-today-btn {

}

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-soft); letter-spacing: .05em; padding: 4px 0; }
.cal-day {
  aspect-ratio: 1; min-height: 38px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 5px 2px 3px; gap: 2px; border: 1px solid transparent; position: relative;
  font-size: 12.5px; font-weight: 600; color: var(--text);

  transition: background var(--t-fast), transform .1s;
}
.cal-day:hover { background: var(--surface-2); }
.cal-day:active { transform: scale(.92); }
.cal-day.dim { opacity: .3; cursor: pointer; }       /* leading/trailing filler days */
.cal-day.selected { border-color: var(--accent); background: var(--accent-softer); }
/* Today = filled accent circle behind the number (iOS style) */
.cal-day.today .num {

}
/* Festival days get a fixed purple ring (mode-independent) */

.cal-day.selected.today { border-color: var(--accent); }
.cal-day .dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; max-width: 100%; }
.cal-day .dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: block;
}
.cal-day .dots i.done { background: var(--text-soft); opacity: .5; }
.cal-day .dots i.overdue { background: var(--danger); }
.cal-day .dots i.fest { background: var(--festival); }
.cal-legend { display: flex; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--text-soft); flex-wrap: wrap; }
.cal-legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.cal-legend .l1 i { background: var(--accent); }
.cal-legend .l2 i { background: var(--danger); }

/* ------------------------ day-detail popover ------------------------ */
.day-pop {
  position: absolute; z-index: 60; width: min(300px, calc(100vw - 48px));
  background: var(--glass-bg);

}
.dp-rem {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 10px;
  background: var(--surface-2); margin-bottom: 5px; font-size: 12.5px; color: var(--text);
}
.dp-rem .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-rem .tm { margin-left: auto; font-size: 11px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.dp-rem.done { opacity: .55; text-decoration: line-through; }
.dp-fest { display: flex; gap: 9px; padding: 8px 9px; border-radius: 12px;

.dp-fest .fi { font-size: 15px; line-height: 1.2; }
.dp-fest .fn { font-size: 12.5px; font-weight: 700; color: var(--text); }
.dp-fest .ft {
  display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 1.5px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px;
  background: var(--festival); color: #fff;
}
.dp-fest .ft.national { background: #7e22ce; }
.dp-fest .fd { font-size: 11.5px; color: var(--text-soft); line-height: 1.45; margin-top: 2px; }
.dp-empty { font-size: 12px; color: var(--text-soft); padding: 4px 2px 0; }

/* ===========================================================================
   9. MODAL (add / edit reminder)
   ========================================================================= */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: var(--overlay); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;   /* slides up from bottom on mobile */
  opacity: 0; pointer-events: none; transition: opacity var(--t-med);
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal {
  width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
  background: var(--glass-sheen), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-brd);
  border-radius: 28px 28px 0 0;                    /* iOS sheet: big top corners */

  padding: 22px; transform: translateY(24px); transition: transform var(--t-med);
}
.modal-overlay.show .modal { transform: none; }
@media (min-width: 640px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: 28px; transform: translateY(12px) scale(.98); }
}

.modal-head { display: flex; align-items: center; margin-bottom: 16px; }
.modal-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.modal-head .icon-btn { margin-left: auto; font-size: 15px; }

/* Form */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 5px; letter-spacing: .02em; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; font: 500 14px var(--font);
  color: var(--text); background: var(--surface-2);
  border: 1px solid transparent; border-radius: 12px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-softer);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.field input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.error-msg { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; }
.error-msg.show { display: block; }

/* Modal footer actions */
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; padding: 10px; border-radius: var(--r-md); font: 600 14px var(--font); cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: filter var(--t-fast), background var(--t-fast); }
.btn:hover { filter: brightness(.97); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-strong); filter: none; }
.btn-danger-ghost { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-danger-ghost:hover { background: var(--danger-soft); filter: none; }

/* ===========================================================================
   10. TOASTS (fallback notifications + feedback)
   ========================================================================= */
.toast-region {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 32px));
}
.toast {
  background: var(--glass-sheen), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-brd); border-left: 4px solid var(--accent);
  border-radius: 18px; box-shadow: var(--shadow-md);
  padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in .3s cubic-bezier(.4,0,.2,1) both;
}
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.toast.leaving { opacity: 0; transform: translateX(24px); transition: all var(--t-med); }
.toast .t-ico { font-size: 17px; line-height: 1.2; }
.toast .t-title { font-size: 13.5px; font-weight: 700; }
.toast .t-body { font-size: 12.5px; color: var(--text-soft); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.toast .t-close { margin-left: auto; flex: none; }

/* ===========================================================================
   11. FOOTER
   ========================================================================= */
.app-footer { text-align: center; padding: 26px 20px 34px; font-size: 12px; color: var(--text-soft); }

/* --- Backup row (export / import) ---
   Small, quiet ghost buttons that inherit the active accent. */
.backup-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.backup-btn {
  font: 600 12px/1 var(--font);
  color: var(--accent);
  background: var(--accent-softer);
  border: none;
  border-radius: var(--r-pill);
  padding: 8px 15px;
  cursor: pointer;
  transition: color var(--t-fast), background var(--t-fast), transform var(--t-fast);
}
.backup-btn:hover { background: var(--accent-soft); transform: translateY(-1px); }
.backup-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-softer);
}

/* Import merge choice bar — replaces the footer buttons while deciding */
.merge-bar {

}

.merge-bar .backup-btn:hover { background: var(--accent-soft); }

/* ===========================================================================
   12. SMALL SCREENS
   ========================================================================= */
@media (max-width: 560px) {

        <div class="field">
          <label for="fPriority">Priority</label>
          <select id="fPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <!-- Repeat -->
      <div class="field">
        <label for="fRepeat">Repeat</label>
        <select id="fRepeat">
          <option value="none" selected>None</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
      </div>

      <div class="modal-actions">
        <!-- Shown only when editing an existing reminder -->
        <button type="button" class="btn btn-danger-ghost" id="deleteBtn" hidden>Delete</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Reminder</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast region (fallback notifications + feedback messages) -->
<div class="toast-region" id="toastRegion" aria-live="polite"></div>

<script>
/* ============================================================================
   Switchr — application script
   ----------------------------------------------------------------------------
   NOTE: localStorage key names keep their legacy "remindly.*" prefix on
   purpose, so upgrades preserve every existing user's reminders.
   ----------------------------------------------------------------------------
   Sections:
     1. Constants & state
     2. Utilities (dates, storage, misc)
     3. Rendering — list, completed, empty state, stats, calendar
     4. Modal (add / edit)
     5. Mode & theme
     6. Notifications (permission, trigger check, sound, toasts)
     7. Event wiring & boot
   ========================================================================= */
(function () {
  'use strict';

  /* ==========================================================================
     1. CONSTANTS & STATE
     ========================================================================== */

  var STORAGE_KEY   = 'remindly.reminders.v1'; // all reminders
  var PREFS_KEY     = 'remindly.prefs.v1';     // theme / mode / collapsed state

  /* Name used in the header greeting ("Good evening, <name>").
     Change this one constant to personalize. */
  var USER_NAME = 'Shubrat';

  /** @type {Array<Object>} source of truth for every reminder */
  var state = {
    reminders: [],
    mode: 'study',            // active category tab: 'study' | 'personal'
    theme: 'light',           // 'light' | 'dark'
    completedOpen: false,     // is the Completed section expanded?
    query: '',                // search text (within active category)
    editingId: null,          // reminder being edited (null = adding)
    view: 'list',             // mobile main view: 'list' | 'calendar'
    soundVol: 1               // alert volume: 1 (loud) | 0.5 (low) | 0 (muted)
  };

  // Track which reminders have already fired so notifications trigger once.
  var fired = {}; // id -> true (not persisted; re-arming handled on load/rollover)

  /* ==========================================================================
     2. UTILITIES
     ========================================================================== */

  var $ = function (sel) { return document.querySelector(sel); };

  /** Pad a number to two digits ("9" -> "09"). */
  function pad(n) { return String(n).padStart(2, '0'); }

  /** Reminder's target Date object (from its date + time strings). */
  function remDate(r) { return new Date(r.date + 'T' + (r.time || '09:00')); }

  /** True if the reminder's time is in the past and it isn't done. */
  function isOverdue(r) {
    return !r.done && remDate(r).getTime() < Date.now();
  }

  /** Local yyyy-mm-dd for a Date (NOT toISOString — that's UTC). */
  function toLocalISO(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** Is the reminder scheduled for "today"? */
  function isToday(r) {
    return r.date === toLocalISO(new Date());
  }

  /** Format time as h:mm am/pm (locale-independent, compact). */
  function fmtTime(hhmm) {
    var p = hhmm.split(':'), h = +p[0], m = p[1];
    var am = h < 12, h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + (am ? 'am' : 'pm');
  }

  /** Friendly absolute date label: "Today", "Tomorrow", "Mon, Sep 14". */
  function fmtDate(dateStr) {
    var d = new Date(dateStr + 'T00:00');
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var diff = Math.round((d - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  /**
   * Relative countdown for a reminder, e.g. "in 2 hours", "in 3 days",
   * "2 hours ago", "now". Human-first, coarse-grained.
   */
  function countdown(r) {
    var ms = remDate(r) - Date.now();
    var abs = Math.abs(ms), future = ms >= 0;
    var mins = Math.round(abs / 60000);
    var label;
    if (mins < 1)        label = 'now';
    else if (mins < 60)  label = mins + ' min' + (mins === 1 ? '' : 's');
    else if (mins < 1440) label = Math.floor(mins / 60) + ' hr' + (Math.floor(mins / 60) === 1 ? '' : 's');
    else                 label = Math.round(mins / 1440) + ' day' + (Math.round(mins / 1440) === 1 ? '' : 's');
    if (label === 'now') return 'now';
    return future ? 'in ' + label : label + ' ago';
  }

  /* ---------------------------- storage ------------------------------ */

  /** Mobile view switch: 'list' | 'calendar' (desktop shows both panels). */
  function setView(v) {
    state.view = (v === 'calendar') ? 'calendar' : 'list';
    document.body.dataset.view = state.view;
    document.querySelectorAll('.view-tab').forEach(function (t) {
      var on = t.dataset.view === state.view;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', String(on));
    });
    savePrefs();
    if (state.view === 'calendar') renderCalendar();   // fresh dots + layout
  }

  /** Load reminders + prefs from localStorage (fail-soft). */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      state.reminders = raw ? JSON.parse(raw) : [];
    } catch (e) { state.reminders = []; }

    try {
      var prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
      if (prefs.theme) state.theme = prefs.theme;
      if (prefs.mode)  state.mode  = prefs.mode;
      if (typeof prefs.completedOpen === 'boolean') state.completedOpen = prefs.completedOpen;
      if (prefs.view === 'calendar' || prefs.view === 'list') state.view = prefs.view;
      if (prefs.soundVol === 1 || prefs.soundVol === 0.5 || prefs.soundVol === 0) state.soundVol = prefs.soundVol;
    } catch (e) { /* defaults already set */ }
  }

  /** Persist reminders. */
  function saveReminders() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.reminders)); }
    catch (e) { toast('⚠️', 'Storage full', 'Could not save reminders.'); }
    // Let listeners (glance strip, open day popover) refresh themselves.
    document.dispatchEvent(new CustomEvent('reminderChanged'));
  }

  /** Persist UI prefs. */
  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        theme: state.theme, mode: state.mode, completedOpen: state.completedOpen,
        view: state.view, soundVol: state.soundVol
      }));
    } catch (e) { /* non-critical */ }
  }

  /** Stable-ish unique id. */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /** Escape HTML in user-entered strings before injecting into innerHTML. */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ==========================================================================
     3. RENDERING
     ========================================================================== */

  /** Reminders in the active category matching the search query. */
  function visibleReminders() {
    var q = state.query.toLowerCase();
    return state.reminders.filter(function (r) {
      if (r.category !== state.mode) return false;
      if (!q) return true;
      return (r.title + ' ' + (r.notes || '')).toLowerCase().indexOf(q) !== -1;
    });
  }

  /** Sort: soonest first; completed items sink to the bottom. */
  function bySoonest(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return remDate(a) - remDate(b);
  }

  /** Full re-render of list, completed section, stats and calendar. */
  function render() {
    renderList();
    renderCompleted();
    renderStats();
    renderCalendar();
  }

  /* ------------------------------ list ------------------------------- */

  function renderList() {
    var ul = $('#reminderList');
    var items = visibleReminders().filter(function (r) { return !r.done; })
                                   .sort(bySoonest);

    var html = items.map(function (r) {
      var overdue = isOverdue(r);
      return '' +
      '<li class="reminder-item' + (overdue ? ' overdue' : '') + '" data-id="' + r.id + '">' +
        '<input type="checkbox" class="rem-check" data-action="toggle" aria-label="Mark &quot;' + esc(r.title) + '&quot; done"' + (r.done ? ' checked' : '') + '>' +
        '<div class="rem-body">' +
          '<div class="rem-title">' + esc(r.title) + '</div>' +
          (r.notes ? '<div class="rem-notes">' + esc(r.notes) + '</div>' : '') +
          '<div class="rem-meta">' +
            '<span class="tag tag-cat">' + esc(r.category) + '</span>' +
            '<span class="tag tag-pri ' + r.priority + '">' + r.priority + '</span>' +
            '<span>📅 ' + fmtDate(r.date) + ' · ' + fmtTime(r.time) + '</span>' +
            '<span class="countdown" data-countdown="' + r.id + '">' + esc(countdown(r)) + '</span>' +
            (r.repeat && r.repeat !== 'none' ? '<span class="tag tag-repeat">🔁 ' + r.repeat + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="rem-actions">' +
          '<button class="icon-btn" data-action="edit" title="Edit" aria-label="Edit reminder">✏️</button>' +
          '<button class="icon-btn" data-action="delete" title="Delete" aria-label="Delete reminder">🗑️</button>' +
        '</div>' +
      '</li>';
    }).join('');

    ul.innerHTML = html;
    $('#emptyState').hidden = items.length > 0 || hasCompletedVisible();
    renderEmptyCopy();
  }

  /* --------------------------- completed ----------------------------- */

  function hasCompletedVisible() {
    return visibleReminders().some(function (r) { return r.done; });
  }

  function renderCompleted() {
    var sec = $('#completedSec');
    var done = visibleReminders().filter(function (r) { return r.done; })
                                  .sort(bySoonest);
    sec.hidden = done.length === 0;

    $('#completedCount').textContent = done.length;
    $('#completedHead').classList.toggle('open', state.completedOpen);
    $('#completedHead').setAttribute('aria-expanded', String(state.completedOpen));

    var listEl = $('#completedList');
    listEl.innerHTML = done.map(function (r) {
      return '' +
      '<li class="reminder-item done" data-id="' + r.id + '">' +
        '<input type="checkbox" class="rem-check" data-action="toggle" checked aria-label="Mark &quot;' + esc(r.title) + '&quot; not done">' +
        '<div class="rem-body">' +
          '<div class="rem-title">' + esc(r.title) + '</div>' +
          '<div class="rem-meta">' +
            '<span class="tag tag-cat">' + esc(r.category) + '</span>' +
            '<span>📅 ' + fmtDate(r.date) + ' · ' + fmtTime(r.time) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="rem-actions">' +
          '<button class="icon-btn" data-action="delete" title="Delete" aria-label="Delete reminder">🗑️</button>' +
        '</div>' +
      '</li>';
    }).join('');

    // Animate open/close via max-height (0 -> content height).
    listEl.style.maxHeight = state.completedOpen ? listEl.scrollHeight + 'px' : '0px';
  }

  /* -------------------------- empty state ---------------------------- */

  function renderEmptyCopy() {
    var empty = $('#emptyState');
    if (empty.hidden) return;
    var searching = state.query.length > 0;
    $('#emptyIco').textContent   = searching ? '🔍' : '🎉';
    $('#emptyTitle').textContent = searching ? 'No matches' : 'All clear!';
    $('#emptyText').textContent  = searching
      ? 'Nothing in ' + state.mode + ' matches "' + state.query + '".'
      : 'Nothing scheduled in ' + state.mode + '. Add one and we\'ll nudge you right on time.';
    $('#emptyAddBtn').hidden = searching; // hide "add" CTA while searching

    renderGlance(searching);
  }

  /* ------------------- "This week at a glance" strip ------------------ */

  /* ISO string of the day the greeting/glance were last rendered for —
     lets tick() detect midnight rollover and refresh them. */
  var glanceDayStr = '';

  /** Header greeting: "Good evening, Shubrat" + smaller date underneath. */
  function renderGreeting() {
    var h = new Date().getHours();
    var part = h < 5 ? 'evening' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
    var el = $('#todayLine');
    if (el) el.innerHTML =
      '<span class="greet">Good ' + part + ', ' + esc(USER_NAME) + '</span>' +
      ' <span class="d">· ' +
      esc(new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) +
      '</span>';
  }

  /* Quiet-lines shown (one per visit, picked at random) when the whole
     glance window is empty — the space should never feel like a void. */
  var MOTIVATION = [
    'A clear plate is a good place to start.',
    'Nothing planned — the day is all yours.',
    'Quiet week. Add something worth remembering.',
    'Smooth sailing — no festivals, no due dates nearby.',
    'An empty list is a quiet mind.'
  ];

  /** Render the 7-day strip (today −2 … +4) under the empty-state copy:
      each day carries the same dots as the calendar — reminders (accent,
      red = overdue, grey = done) and festivals (fixed purple). Days with
      anything on them deep-link into the calendar day popover. If the
      window is completely quiet, show a motivational line instead. */
  function renderGlance(searching) {
    var strip = $('#glanceStrip');
    if (!strip || searching) { if (strip) strip.innerHTML = ''; return; }

    var today = new Date(); today.setHours(0, 0, 0, 0);
    var todayISO = toLocalISO(today);
    var dow = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

    var anyFest = false, anyRem = false, cells = '';
    for (var off = -2; off <= 4; off++) {
      var d   = new Date(today); d.setDate(today.getDate() + off);
      var iso = toLocalISO(d);
      var rems = state.reminders.filter(function (r) { return r.date === iso; });
      var fests = festsOn(iso);
      if (fests.length) anyFest = true;
      if (rems.length)  anyRem  = true;

      var dots = rems.slice(0, 3).map(function (r) {
        return '<i class="' + (r.done ? 'done' : (isOverdue(r) ? 'overdue' : '')) + '"></i>';
      }).join('');
      if (fests.length) dots += '<i class="fest"></i>';

      var t = iso === todayISO ? ' today' : '';
      var f = fests.length ? ' has-fest' : '';
      var interactive = (rems.length || fests.length);
      cells += interactive
        ? '<button type="button" class="g-day' + t + f + '" data-gdate="' + iso + '">' +
            '<span class="gd">' + dow[d.getDay()] + '</span>' +
            '<span class="gn">' + d.getDate() + '</span>' +
            '<span class="dots">' + dots + '</span>' +
          '</button>'
        : '<div class="g-day' + t + f + '" aria-hidden="true">' +
            '<span class="gd">' + dow[d.getDay()] + '</span>' +
            '<span class="gn">' + d.getDate() + '</span>' +
            '<span class="dots">' + dots + '</span>' +
          '</div>';
    }

    // Everything nearby quiet? Rotate a short line instead of an empty strip.
    var tail = (anyFest || anyRem)
      ? '<div class="g-title">This week at a glance</div><div class="g-row">' + cells + '</div>'
      : '<div class="g-motiv">' + MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)] + '</div>';

    strip.innerHTML = tail;
  }

  /** Glance day → open the month calendar on that month and pop the day. */
  function jumpToDay(iso) {
    setView('calendar');
    calGoTo(new Date(iso + 'T00:00:00'));
    showDayPop(iso, document.querySelector('.cal-day[data-date="' + iso + '"]'));
  }

  /* ----------------------------- stats ------------------------------- */

  /** "3 due today · 1 overdue" across BOTH categories (global view). */
  function renderStats() {
    var dueToday = state.reminders.filter(function (r) { return !r.done && isToday(r); }).length;
    var overdue  = state.reminders.filter(isOverdue).length;
    var parts = [];
    if (dueToday) parts.push('<b>' + dueToday + '</b> due today');
    if (overdue)  parts.push('<span class="overdue">' + overdue + ' overdue</span>');
    $('#statsLine').innerHTML = parts.length ? parts.join(' · ') : 'You\'re all caught up ✨';
  }

/* ------------------------- festivals (offline) ----------------------- */

  /* Bundled Indian festivals & holidays (festivals.json, fetched once and
     cached in-memory + localStorage). Fully offline — no external APIs.
     localStorage copy makes it instant + resilient if the SW is cold. */
  var FEST_CACHE_KEY = 'remindly.festivals.v1';
  var festivalsByDate = null;   // { 'YYYY-MM-DD': [{name, type, desc}] }

  function loadFestivals() {
    // 1) Instant paint from localStorage copy, if present.
    try {
      var cached = localStorage.getItem(FEST_CACHE_KEY);
      if (cached) { festivalsByDate = JSON.parse(cached); }
    } catch (e) { festivalsByDate = null; }

    // 2) Then refresh from the bundled file (keeps data current across updates).
    if (location.protocol === 'file:') {
      // fetch(file://) is blocked by browsers; without the localStorage copy
      // the calendar still works — just without festival dots.
      if (festivalsByDate) return;
      festivalsByDate = {};
      return;
      }
    fetch('festivals.json')
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (data) {
        var byDate = {};
        Object.keys(data.years || {}).forEach(function (y) {
          (data.years[y] || []).forEach(function (f) {
            (byDate[f.d] = byDate[f.d] || []).push({
              name: f.name, type: f.type, desc: f.desc
            });
          });
        });
        festivalsByDate = byDate;
        try { localStorage.setItem(FEST_CACHE_KEY, JSON.stringify(byDate)); } catch (e) {}

        /* Festivals usually arrive AFTER the first paint (async fetch vs the
           synchronous render in init). Without this refresh, festival dots
           and rings would only show up on the next unrelated re-render —
           e.g. after toggling modes — never on first view. */
        renderCalendar();
        renderGlance(state.query.length > 0);   // glance strip may be visible
        var sel = document.querySelector('.cal-day.selected');
        if (sel && calSelected) showDayPop(calSelected, sel);   // refresh open popover
      })
      .catch(function () {
        if (!festivalsByDate) festivalsByDate = {};   // fail-soft: no dots
      });
  }

  /** Festivals on an ISO date, or []. */
  function festsOn(iso) { return (festivalsByDate && festivalsByDate[iso]) || []; }

  /* ---------------------------- calendar ----------------------------- */

  var calView     = null; // { y, m } month being viewed (m = 0-11)
  var calSelected = null; // ISO date shown in the day popover, or null

  /** Sunday of the given date's week (grid rows start on Sunday). */
  function sundayOf(d) {
    var s = new Date(d); s.setHours(0, 0, 0, 0);
    s.setDate(s.getDate() - s.getDay());
    return s;
  }

  /** Jump the calendar to the month containing date d (popover closed). */
  function calGoTo(d) {
    calView = { y: d.getFullYear(), m: d.getMonth() };
    calSelected = null;
    renderCalendar();
  }

  /** Render the 6-row month grid with reminder + festival dots. */
  function renderCalendar() {
    if (!calView) calView = { y: new Date().getFullYear(), m: new Date().getMonth() };
    var grid  = $('#calGrid');
    var label = $('#calMonthLabel');
    var todayISO = toLocalISO(new Date());

    // "September 2026"
    label.textContent =
      new Date(calView.y, calView.m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    // Group reminders by local date string for quick lookup.
    var byDate = {};
    state.reminders.forEach(function (r) {
      (byDate[r.date] = byDate[r.date] || []).push(r);
    });

    // 42 cells = 6 full weeks; leading cells are the tail of the previous month.
    var start = sundayOf(new Date(calView.y, calView.m, 1));
    var dows = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    var html = dows.map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

    for (var i = 0; i < 42; i++) {
      var day = new Date(start);
      day.setDate(start.getDate() + i);
      var iso     = toLocalISO(day);
      var rems    = byDate[iso] || [];
      var fests   = festsOn(iso);
      var inMonth = day.getMonth() === calView.m;

      // Up to 4 reminder dots + one saffron dot if a festival falls that day.
      var dots = rems.slice(0, 4).map(function (r) {
        var cls = r.done ? 'done' : (isOverdue(r) ? 'overdue' : '');
        return '<i class="' + cls + '" title="' + esc(r.title) + '"></i>';
      }).join('');
      if (fests.length) dots += '<i class="fest" title="' + esc(fests[0].name) + '"></i>';
      if (dots) dots = '<span class="dots">' + dots + '</span>';

      var cls = 'cal-day';
      if (!inMonth)          cls += ' dim';
      if (iso === todayISO)  cls += ' today';
      if (fests.length)      cls += ' festival';
      if (calSelected === iso) cls += ' selected';

      html += '<button type="button" class="' + cls + '" data-date="' + iso + '" ' +
                'aria-label="' + iso + (fests.length ? ', ' + esc(fests[0].name) : '') + '">' +
                '<span class="num">' + day.getDate() + '</span>' + dots +
              '</button>';
    }
    grid.innerHTML = html;
  }

  /* ------------------------ day-detail popover ------------------------ */

  /** Open the popover for an ISO date: that day's festivals + reminders. */
  function showDayPop(iso, anchorBtn) {
    var pop   = $('#dayPop');
    var d     = new Date(iso + 'T00:00:00');
    var rems  = state.reminders.filter(function (r) { return r.date === iso; })
                               .sort(function (a, b) { return a.time < b.time ? -1 : 1; });
    var fests = festsOn(iso);

    var md      = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    var dowName = d.toLocaleDateString(undefined, { weekday: 'long' });
    var tag     = iso === toLocalISO(new Date()) ? ' · today' : '';

    var h = '<div class="day-pop-head">' +
              '<span class="d">' + esc(md) + '</span>' +
              '<span class="w">' + esc(dowName + ' · ' + d.getFullYear()) + esc(tag) + '</span>' +
              '<button class="day-pop-close" data-pop="close" aria-label="Close">✕</button>' +
            '</div>';

    if (fests.length) {
      h += '<div class="day-pop-sec"><h5>Festival · Holiday</h5>';
      fests.forEach(function (f) {
        h += '<div class="dp-fest">' +
               '<span class="fi">' + (f.type === 'national' ? '🇮🇳' : '🪔') + '</span>' +
               '<div><span class="fn">' + esc(f.name) + '</span>' +
               '<span class="ft' + (f.type === 'national' ? ' national' : '') + '">' + f.type + '</span>' +
               '<div class="fd">' + esc(f.desc) + '</div></div>' +
             '</div>';
      });
      h += '</div>';
    }

    if (rems.length) {
      h += '<div class="day-pop-sec"><h5>Reminders</h5>';
      rems.forEach(function (r) {
        h += '<div class="dp-rem' + (r.done ? ' done' : '') + '">' +
               '<span class="t">' + esc(r.title) + '</span>' +
               '<span class="tm">' + esc(fmtTime(r.time)) + '</span>' +
             '</div>';
      });
      h += '</div>';
    }

    if (!fests.length && !rems.length) {
      h += '<div class="dp-empty">Nothing on this day — clear skies. 🌤</div>';
    }

    pop.innerHTML = h;
    pop.hidden = false;
    calSelected = iso;

    // Position below the clicked cell (flip above if it would overflow),
    // clamped horizontally to the calendar panel.
    var panel = pop.offsetParent || document.body;
    var pr = panel.getBoundingClientRect();
    var br = anchorBtn.getBoundingClientRect();
    var ph = pop.offsetHeight || 180;
    var top = br.bottom - pr.top + 8;
    if (top + ph > pr.height) top = Math.max(8, br.top - pr.top - ph - 8);
    pop.style.top  = top + 'px';
    pop.style.left = Math.max(8, Math.min(br.left - pr.left, pr.width - pop.offsetWidth - 8)) + 'px';
  }

  /** Hide the popover and clear the selected-day highlight. */
  function closeDayPop() {
    $('#dayPop').hidden = true;
    calSelected = null;
    document.querySelectorAll('.cal-day.selected').forEach(function (el) {
      el.classList.remove('selected');
    });
  }

  /* ==========================================================================
     4. MODAL — add / edit
     ========================================================================== */

  var overlay = $('#modalOverlay');

  /** Open modal. editingId=null → add new (category pre-set to active mode). */
  function openModal(editingId) {
    state.editingId = editingId || null;
    var r = editingId ? state.reminders.find(function (x) { return x.id === editingId; }) : null;

    $('#modalTitle').textContent = r ? 'Edit Reminder' : 'Add Reminder';
    $('#fTitle').value     = r ? r.title : '';
    $('#fNotes').value     = r ? (r.notes || '') : '';
    // New reminders default date/time: today at the next round hour.
    var def = new Date(Date.now() + 60 * 60 * 1000);
    def.setMinutes(0, 0, 0);
    $('#fDate').value = r ? r.date : toLocalISO(def);
    $('#fTime').value = r ? r.time : pad(def.getHours()) + ':00';
    $('#fCategory').value   = r ? r.category : state.mode;   // ← defaults to active tab
    $('#fPriority').value   = r ? r.priority : 'medium';
    $('#fRepeat').value     = r ? r.repeat : 'none';

    $('#deleteBtn').hidden = !r;      // "Delete" only exists when editing
    $('#titleErr').classList.remove('show');
    $('#fTitle').classList.remove('invalid');

    overlay.classList.add('show');
    setTimeout(function () { $('#fTitle').focus(); }, 60); // focus after transition starts
  }

  function closeModal() {
    overlay.classList.remove('show');
    state.editingId = null;
  }

  /** Validate + save (create or update), then re-render. */
  function saveFromForm() {
    var title = $('#fTitle').value.trim();
    var date  = $('#fDate').value;
    var time  = $('#fTime').value;

    // Basic validation: title + date + time required.
    if (!title) {
      $('#titleErr').classList.add('show');
      $('#fTitle').classList.add('invalid');
      $('#fTitle').focus();
      return;
    }
    if (!date || !time) {
      toast('⚠️', 'Missing date or time', 'Pick when this reminder should fire.');
      return;
    }

    if (state.editingId) {
      // Update in place.
      var r = state.reminders.find(function (x) { return x.id === state.editingId; });
      if (r) {
        r.title = title; r.notes = $('#fNotes').value.trim();
        r.date = date;   r.time = time;
        r.category = $('#fCategory').value;
        r.priority = $('#fPriority').value;
        r.repeat = $('#fRepeat').value;
      }
      toast('✏️', 'Reminder updated', title);
    } else {
      state.reminders.push({
        id: uid(), title: title, notes: $('#fNotes').value.trim(),
        date: date, time: time,
        category: $('#fCategory').value,
        priority: $('#fPriority').value,
        repeat: $('#fRepeat').value,
        done: false, createdAt: Date.now()
      });
      toast('✅', 'Reminder added', title);
    }

    saveReminders();
    closeModal();
    render();
  }
