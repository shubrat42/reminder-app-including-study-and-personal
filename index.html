  /* ==========================================================================
     6. NOTIFICATIONS
     ========================================================================== */

  /**
   * Ask for Notification permission shortly after load (a small delay avoids
   * the "permission prompt immediately on load" jank). Non-secure origins /
   * unsupported browsers fail soft — toasts still work.
   */
  function setupNotifications() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      setTimeout(function () {
        try { Notification.requestPermission(); } catch (e) { /* ignore */ }
      }, 1500);
    }
  }

  /** Fire a browser Notification (if allowed) for a due reminder. */
  function notify(rem) {
    var body = (rem.notes ? rem.notes + '\n' : '') + fmtDate(rem.date) + ' · ' + fmtTime(rem.time);
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        var n = new Notification('⏰ ' + rem.title, { body: body, tag: rem.id }); // tag dedupes repeats
        n.onclick = function () { window.focus(); n.close(); };
      } catch (e) { toastFallback(rem); } // Some browsers throw if SW-less; fall back
    } else {
      toastFallback(rem);
    }
  }

  /** In-app toast used when notifications are blocked/unavailable. */
  function toastFallback(rem) {
    toast('⏰', rem.title, rem.notes || 'Scheduled for ' + fmtDate(rem.date) + ' · ' + fmtTime(rem.time), 8000);
  }

  /**
   * THE TICK — runs every second.
   * Fires each reminder exactly once when its time arrives, handles repeat
   * rollover (daily/weekly), and refreshes the visible countdowns.
   */
  function tick() {
    var now = Date.now();
    var changed = false;

    state.reminders.forEach(function (r) {
      if (r.done) return;
      var t = remDate(r).getTime();

      if (!fired[r.id] && t <= now && now - t < 60000) { // fire within 1 min of due time
        fired[r.id] = true;
        notify(r);
        playAlert();

        // Repeat rollover: push the reminder to its next occurrence.
        if (r.repeat === 'daily') {
          r.date = shiftDays(r.date, 1); changed = true;
        } else if (r.repeat === 'weekly') {
          r.date = shiftDays(r.date, 7); changed = true;
        }
      }
    });

    if (changed) saveReminders();

    // Midnight (or first tick after): refresh greeting + empty-state strip,
    // since "today" just moved and the glance window slides with it.
    var dstr = toLocalISO(new Date());
    if (dstr !== glanceDayStr) {
      glanceDayStr = dstr;
      renderGreeting();
      renderGlance(state.query.length > 0);
    }

    // Cheap per-second refresh of countdown labels only (no full re-render).
    document.querySelectorAll('[data-countdown]').forEach(function (el) {
      var r = state.reminders.find(function (x) { return x.id === el.dataset.countdown; });
      if (r) el.textContent = countdown(r);
    });
  }

  /** yyyy-mm-dd + n days → new yyyy-mm-dd. */
  function shiftDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00');
    d.setDate(d.getDate() + n);
    return toLocalISO(d);
  }

  /* ---------------------------------------------------------------------
     ALERT SOUND — a synthesized ~1.2s "ding-DONG" two-tone alert.
     Rendered once to a WAV blob (no audio file needed — the app stays
     self-contained) and preloaded into an <audio> element at page load,
     so it fires instantly and is MUCH louder than the old whisper-quiet
     WebAudio sine chime (peak ~0.12 → ~0.8 full-scale).
     ------------------------------------------------------------------ */
  var alertAudio = null;               // preloaded HTMLAudioElement

  /** Synthesize a sharp two-tone alert (A5 → E5) as 16-bit mono WAV bytes. */
  function buildAlertWav() {
    var sr = 22050, dur = 1.2, n = (sr * dur) | 0;
    var pcm = new Int16Array(n);
    var tones = [
      { f: 880.00, t0: 0.00, t1: 0.45 },   // "ding" — sharp, short
      { f: 659.25, t0: 0.55, t1: 1.15 }    // "DONG" — lands with a decay tail
    ];
    for (var i = 0; i < n; i++) {
      var t = i / sr, s = 0;
      for (var k = 0; k < tones.length; k++) {
        var tn = tones[k];
        if (t >= tn.t0 && t < tn.t1) {
          var lt = t - tn.t0, len = tn.t1 - tn.t0;
          // 4ms fade-in / 30ms fade-out (anti-click) + slight sustain decay
          var env = Math.min(1, lt / 0.004) * Math.min(1, (len - lt) / 0.03) * (1 - 0.25 * lt / len);
          s += Math.sin(6.2832 * tn.f * lt) * 0.80 * env;       // fundamental — loud
          s += Math.sin(6.2832 * tn.f * 2 * lt) * 0.16 * env;   // octave — "sharp" edge
        }
      }
      pcm[i] = Math.max(-32768, Math.min(32767, Math.round(s * 32767)));
    }
    // Wrap the PCM in a minimal 44-byte WAV header.
    var buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
    function str(off, s) { for (var j = 0; j < s.length; j++) v.setUint8(off + j, s.charCodeAt(j)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, pcm.length * 2, true);
    for (i = 0; i < n; i++) v.setInt16(44 + i * 2, pcm[i], true);
    return buf;
  }

  /** Build + preload the alert audio (called once at page load). */
  function initAlert() {
    try {
      var blob = new Blob([buildAlertWav()], { type: 'audio/wav' });
      alertAudio = new Audio(URL.createObjectURL(blob));
      alertAudio.preload = 'auto';           // zero delay when it fires
      alertAudio.volume = state.soundVol;
      alertAudio.load();
    } catch (e) { alertAudio = null; /* WebAudio fallback covers us */ }
  }

  /** Play the alert at the chosen volume (0 = muted → stay silent). */
  function playAlert() {
    if (!state.soundVol) return;             // muted
    try {
      if (alertAudio) {
        alertAudio.currentTime = 0;
        alertAudio.volume = state.soundVol;  // explicit, right before .play()
        var p = alertAudio.play();
        if (p && p.catch) p.catch(function () { playChime(); }); // autoplay blocked
      } else {
        playChime();                         // blob unavailable → WebAudio path
      }
    } catch (e) { playChime(); }
  }

  /** iOS/Safari: audio needs one user gesture before it can play — silently
      "unlock" both audio paths on the first tap so alerts work later. */
  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) playChime._ctx = playChime._ctx || new Ctx();
      if (playChime._ctx && playChime._ctx.state === 'suspended') playChime._ctx.resume();
    } catch (e) {}
    try {
      if (alertAudio) {
        alertAudio.volume = 0;
        var p = alertAudio.play();
        if (p && p.then) p.then(function () {
          alertAudio.pause(); alertAudio.currentTime = 0;
          alertAudio.volume = state.soundVol;
        }).catch(function () {});
      }
    } catch (e) {}
  }

  /** Louder WebAudio fallback (kept from v1, upgraded: 4× the old gain,
      same two-tone shape, in case Blob URLs or autoplay are blocked). */
  function playChime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = playChime._ctx || (playChime._ctx = new Ctx());
      if (ctx.state === 'suspended') ctx.resume();
      var t = ctx.currentTime;
      [[880, 0], [659.25, 0.55]].forEach(function (f) {  // matches the WAV alert
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f[0]; o.type = 'triangle';
        g.gain.setValueAtTime(0.0001, t + f[1]);
        g.gain.exponentialRampToValueAtTime(0.5, t + f[1] + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + f[1] + 0.55);
        o.connect(g).connect(ctx.destination);
        o.start(t + f[1]); o.stop(t + f[1] + 0.6);
      });
    } catch (e) { /* audio is best-effort */ }
  }

  /** Footer sound-button label for the current volume level. */
  function renderSoundBtn() {
    var b = $('#soundBtn');
    if (!b) return;
    b.textContent = state.soundVol === 1 ? '🔔 Sound on'
                  : state.soundVol === 0.5 ? '🔉 Sound low'
                  : '🔕 Muted';
  }

  /* ------------------- missed reminders while hidden ------------------ */
  /* Browsers throttle or fully pause timers (and audio) when an installed
     PWA is backgrounded/minimized, so a reminder can come due with no way
     to beep. When the app becomes visible/focused again, any reminder that
     came due in that window fires immediately: notifications + ONE alert. */

  var hiddenAt = 0;   // timestamp of the last hidden→ background transition (0 = visible)

  function onAppVisible() {
    var since = hiddenAt; hiddenAt = 0;
    if (!since) return;                    // was never hidden — nothing to catch up
    try { if (playChime._ctx && playChime._ctx.state === 'suspended') playChime._ctx.resume(); } catch (e) {}
    catchUpMissed(since - 60000);          // 1-min grace for things due just before hiding
  }

  /** Fire everything that came due while the app was hidden. */
  function catchUpMissed(since) {
    var now = Date.now(), missed = [], changed = false;
    state.reminders.forEach(function (r) {
      if (r.done || fired[r.id]) return;
      var t = remDate(r).getTime();
      if (t <= now && t >= since) {
        fired[r.id] = true;
        notify(r);
        missed.push(r);
        // Same repeat rollover as tick().
        if (r.repeat === 'daily')       { r.date = shiftDays(r.date, 1); changed = true; }
        else if (r.repeat === 'weekly') { r.date = shiftDays(r.date, 7); changed = true; }
      }
    });
    if (missed.length) {
      if (changed) saveReminders();
      render();                              // rolled-over dates must show
      playAlert();                           // one sound for the whole batch
      toast('⏰',
        missed.length === 1 ? 'Reminder while you were away' : missed.length + ' reminders while you were away',
        missed.length === 1 ? missed[0].title : missed[0].title + ' + ' + (missed.length - 1) + ' more',
        8000);
    }
  }

  /* ----------------------------- toasts ------------------------------ */

  /** Show an in-app toast. opts: { timeout, onClose } */
  function toast(ico, title, body, timeout) {
    var region = $('#toastRegion');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML =
      '<span class="t-ico" aria-hidden="true">' + ico + '</span>' +
      '<div><div class="t-title">' + esc(title) + '</div>' +
      (body ? '<div class="t-body">' + esc(body) + '</div>' : '') + '</div>' +
      '<button class="icon-btn t-close" aria-label="Dismiss">✕</button>';

    function dismiss() {
      el.classList.add('leaving');
      setTimeout(function () { el.remove(); }, 300);
    }
    el.querySelector('.t-close').onclick = dismiss;
    region.appendChild(el);
    setTimeout(dismiss, timeout || 4000);
  }

  /* ==========================================================================
     6b. BACKUP — EXPORT / IMPORT
     ----------------------------------------------------------------------------
     Reminders live only in this browser's localStorage, so we offer a manual
     safety net: download everything as a .json file, and restore from one.
     The file is the same shape the app stores, plus a small header for
     validation and human readers.
     ========================================================================== */

  /** Download all reminders as a dated .json file. */
  function exportBackup() {
    var payload = {
      app: 'switchr',   // legacy 'remindly' files are accepted on import
      version: 1,
      exportedAt: new Date().toISOString(),
      count: state.reminders.length,
      reminders: state.reminders
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    a.href = url;
    a.download = 'switchr-backup-' + stamp + '.switchr.json';
    document.body.appendChild(a); // Firefox needs it in the DOM before click
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('📦', 'Backup downloaded', state.reminders.length + ' reminder' + (state.reminders.length === 1 ? '' : 's') + ' saved to file.');
  }

  /**
   * Validate + import reminders from a file.
   * Returns a count of added items, or throws Error with a friendly message.
   */
  function parseBackupFile(fileText) {
    var data;
    try { data = JSON.parse(fileText); }
    catch (e) { throw new Error('That file isn\u2019t valid JSON.'); }

    // Header check — accept only files this app produced.
    if (!data || (data.app !== 'switchr' && data.app !== 'remindly') || !Array.isArray(data.reminders)) {
      throw new Error('That doesn\u2019t look like a Switchr backup file.');
    }

    // Keep only well-formed reminders; repair/normalize what we can.
    var clean = [];
    data.reminders.forEach(function (r) {
      if (!r || typeof r.title !== 'string' || !r.title.trim() ||
          typeof r.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) ||
          typeof r.time !== 'string' || !/^\d{2}:\d{2}$/.test(r.time)) {
        return; // skip malformed entries instead of failing the whole import
      }
      clean.push({
        id: (typeof r.id === 'string' && r.id) ? r.id : uid(),
        title: r.title.trim(),
        notes: typeof r.notes === 'string' ? r.notes : '',
        date: r.date,
        time: r.time,
        category: r.category === 'personal' ? 'personal' : 'study',
        priority: ['low', 'medium', 'high'].indexOf(r.priority) !== -1 ? r.priority : 'medium',
        repeat: ['none', 'daily', 'weekly'].indexOf(r.repeat) !== -1 ? r.repeat : 'none',
        done: !!r.done,
        createdAt: typeof r.createdAt === 'number' ? r.createdAt : Date.now()
      });
    });

    if (!clean.length) {
      throw new Error('No valid reminders were found in that file.');
    }
    return clean;
  }

  /** Open the file picker and handle an imported backup. */
  function importBackup() {
    $('#importFile').click();
  }

  /**
   * Merge-strategy prompt: when the file's reminders collide with existing
   * ones (same id), decide keep/replace. Renders a small inline bar in the
   * footer offering both options; anything else cancels.
   */
  function offerMerge(clean) {
    var footer = document.querySelector('.backup-row');
    var existingIds = {};
    state.reminders.forEach(function (r) { existingIds[r.id] = true; });
    var collisions = clean.filter(function (r) { return existingIds[r.id]; }).length;

    var bar = document.createElement('div');
    bar.className = 'merge-bar';
    var n = clean.length;
    bar.innerHTML =
      '<span>Found ' + n + ' reminder' + (n === 1 ? '' : 's') +
      (collisions ? ' (' + collisions + ' already exist' + (n - collisions ? ' … ' : '') + ')' : '') + '.</span>' +
      '<button type="button" class="backup-btn" data-m="add">Add ' + n + '</button>' +
      (collisions ? '<button type="button" class="backup-btn" data-m="replace">Replace ' + collisions + '</button>' : '') +
      '<button type="button" class="backup-btn cancel" data-m="cancel">Cancel</button>';

    footer.replaceWith(bar);

    function restore() { bar.replaceWith(footer); } // put the original row back

    bar.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (!b) return;
      var mode = b.dataset.m;
      restore();
      if (mode === 'cancel') return;

      if (mode === 'add') {
        // "Add": append everything that isn't already present (by id).
        var seen = {};
        state.reminders.forEach(function (r) { seen[r.id] = true; });
        var added = clean.filter(function (r) { return !seen[r.id]; });
        state.reminders = state.reminders.concat(added);
        toast('📥', 'Imported', added.length + ' reminder' + (added.length === 1 ? '' : 's') + ' added.');
      } else {
        // "Replace": overwrite existing items whose ids collide.
        var byId = {};
        state.reminders.forEach(function (r) { byId[r.id] = r; });
        var replaced = 0;
        clean.forEach(function (r) {
          if (byId[r.id]) { replaced++; Object.assign(byId[r.id], r); }
          else state.reminders.push(r);
        });
        toast('📥', 'Imported', replaced + ' updated, ' + (clean.length - replaced) + ' added.');
      }
      rearmFired();      // imported items may be due now — arm them properly
      saveReminders();
      render();
    });
  }

  function wireEvents() {
    // --- Mode toggle ---
    document.querySelectorAll('.mode-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setMode(btn.dataset.mode); });
    });

    // --- Theme toggle ---
    $('#themeBtn').addEventListener('click', function () {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
    });

    // --- Add buttons ---
    $('#addBtn').addEventListener('click', function () { openModal(null); });
    $('#emptyAddBtn').addEventListener('click', function () { openModal(null); });

    // "This week at a glance" strip: days with content deep-link into the
    // calendar day popover. Delegated — the strip re-renders often.
    var strip = $('#glanceStrip');
    if (strip) strip.addEventListener('click', function (e) {
      var btn = e.target.closest('.g-day[data-gdate]');
      if (btn) jumpToDay(btn.getAttribute('data-gdate'));
    });

    // If the day popover is open, keep it truthful after any list change
    // (toggle/delete from the popover re-renders, so refresh it in place).
    document.addEventListener('reminderChanged', function () {
      var pop = $('#dayPop');
      if (pop && !pop.hidden && calSelected) {
        var anchor = document.querySelector('.cal-day[data-date="' + calSelected + '"]');
        if (anchor) showDayPop(calSelected, anchor);
      }
    });

    // ---- alert-sound & background catch-up wiring ----

    // Track hidden→visible: reminders that came due while backgrounded
    // (timers throttled/paused) fire immediately on return.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (!hiddenAt) hiddenAt = Date.now();
      } else {
        onAppVisible();
      }
    });
    // Focus/pageshow cover flows where visibilitychange is unreliable
    // (e.g. some desktop-PWA window switches). No-op if never hidden.
    window.addEventListener('focus', onAppVisible);
    window.addEventListener('pageshow', onAppVisible);

    // iOS/Safari need one user gesture to arm audio — unlock on first tap.
    document.addEventListener('pointerdown', unlockAudio, { once: true });

    // Footer sound toggle: loud → low → muted → loud … (persisted in prefs).
    var soundBtn = $('#soundBtn');
    if (soundBtn) {
      soundBtn.addEventListener('click', function () {
        state.soundVol = state.soundVol === 1 ? 0.5 : (state.soundVol === 0.5 ? 0 : 1);
        savePrefs();
        renderSoundBtn();
        playAlert();   // instant audible confirmation at the new level
      });
    }

    // --- Search (filters within active category) ---
    $('#searchInput').addEventListener('input', function (e) {
      state.query = e.target.value.trim();
      renderList(); renderCompleted(); renderEmptyCopy();
    });

    // --- List click delegation: toggle / edit / delete ---
    document.body.addEventListener('click', function (e) {
      var actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.dataset.action;

      // For checkbox clicks, walk up to the reminder row.
      var row = actionEl.closest('.reminder-item');
      var id = row ? row.dataset.id : null;
      var rem = id ? state.reminders.find(function (x) { return x.id === id; }) : null;
      if (!rem) return;

      if (action === 'toggle') {
        rem.done = actionEl.checked;
        if (rem.done) fired[rem.id] = true;       // done items shouldn't fire
        else delete fired[rem.id];                // un-done → can fire again
        saveReminders(); render();

      } else if (action === 'edit') {
        openModal(rem.id);

      } else if (action === 'delete') {
        // Remove with a graceful fade-out animation.
        row.style.transition = 'opacity .2s, transform .2s';
        row.style.opacity = '0'; row.style.transform = 'translateX(12px)';
        setTimeout(function () {
          state.reminders = state.reminders.filter(function (x) { return x.id !== id; });
          delete fired[id];
          saveReminders(); render();
        }, 180);
      }
    });

    // --- Completed section collapse/expand ---
    $('#completedHead').addEventListener('click', function () {
      state.completedOpen = !state.completedOpen;
      savePrefs(); renderCompleted();
    });

    // --- Calendar: month nav / today / day popover / mobile view tabs ---
    $('#calPrevBtn').addEventListener('click', function () {
      calView.m--; if (calView.m < 0) { calView.m = 11; calView.y--; }
      calSelected = null; renderCalendar();
    });
    $('#calNextBtn').addEventListener('click', function () {
      calView.m++; if (calView.m > 11) { calView.m = 0; calView.y++; }
      calSelected = null; renderCalendar();
    });
    $('#calTodayBtn').addEventListener('click', function () { calGoTo(new Date()); });

    // Day click → popover with that day's festivals + reminders.
    // Clicking the already-selected day closes it (toggle behaviour).
    $('#calGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.cal-day');
      if (!btn) return;
      if (calSelected === btn.dataset.date) { closeDayPop(); return; }
      showDayPop(btn.dataset.date, btn);
    });

    // Popover close button + click-outside-to-dismiss.
    $('#dayPop').addEventListener('click', function (e) {
      if (e.target.closest('[data-pop="close"]')) closeDayPop();
    });
    document.addEventListener('click', function (e) {
      if ($('#dayPop').hidden) return;
      if (e.target.closest('#dayPop') || e.target.closest('.cal-day')) return;
      closeDayPop();
    });

    // Mobile List/Calendar tabs — toggles body[data-view], persists in prefs.
    document.querySelectorAll('.view-tab').forEach(function (tab) {
      tab.addEventListener('click', function () { setView(tab.dataset.view); });
    });

    // --- Modal open/close ---
    $('#modalCloseBtn').addEventListener('click', closeModal);
    $('#cancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
    });

    // --- Form submit ---
    $('#remForm').addEventListener('submit', function (e) { e.preventDefault(); saveFromForm(); });

    // --- Delete button inside the modal ---
    $('#deleteBtn').addEventListener('click', function () {
      if (!state.editingId) return;
      state.reminders = state.reminders.filter(function (x) { return x.id !== state.editingId; });
      delete fired[state.editingId];
      saveReminders(); closeModal(); render();
      toast('🗑️', 'Reminder deleted');
    });

    // --- Clear title error as the user types ---
    $('#fTitle').addEventListener('input', function () {
      $('#titleErr').classList.remove('show');
      $('#fTitle').classList.remove('invalid');
    });

    // --- Backup: export / import ---
    $('#exportBtn').addEventListener('click', exportBackup);
    $('#importBtn').addEventListener('click', importBackup);
    $('#importFile').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';            // reset so the same file can be re-picked
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var clean = parseBackupFile(String(reader.result));
          offerMerge(clean);
        } catch (err) {
          toast('⚠️', 'Import failed', err.message);
        }
      };
      reader.onerror = function () { toast('⚠️', 'Import failed', 'Could not read that file.'); };
      reader.readAsText(file);
    });

    // --- Re-arm fired flags + refresh view when returning to the tab ---
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { rearmFired(); tick(); render(); }
    });
  }

  /**
   * On load (or tab return), mark past reminders as already-fired so users
   * aren't spammed with notifications for things that happened while away —
   * except the very-latest minute, which still deserves a nudge.
   */
  function rearmFired() {
    state.reminders.forEach(function (r) {
      if (r.done) { fired[r.id] = true; return; }
      var t = remDate(r).getTime();
      if (t < Date.now() - 60000) fired[r.id] = true; // older than 1 min → skip
      else delete fired[r.id];
    });
  }

  /* ------------------------------ boot ------------------------------- */

  /**
   * Register the service worker (required for PWA install + offline use).
   * Service workers only exist on http(s) origins — when the file is opened
   * via file:// we simply skip registration; the app works either way.
   */
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol !== 'https:' && !local) return;
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  }

  function init() {
    load();
    loadFestivals();

    // Respect the OS color-scheme preference on first visit.
    if (!localStorage.getItem(PREFS_KEY) &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      state.theme = 'dark';
    }

    setTheme(state.theme);
    setMode(state.mode);
    setView(state.view);
    wireEvents();
    rearmFired();
    render();

    glanceDayStr = toLocalISO(new Date());
    renderGreeting();
    initAlert();      // synthesize + preload the alert sound
    renderSoundBtn();

    setupNotifications();
    registerServiceWorker();
    setInterval(tick, 1000);   // 1s: countdowns stay fresh, trigger check is cheap
  }

  init();
})();
</script>
</body>
</html>
